<section class="lecture-vocale" aria-labelledby="lecture-vocale-titre" data-lecture-vocale>
  <div>
    <h2 id="lecture-vocale-titre">Lecture vocale</h2>
    <p>Choisissez « Écouter les détails » sur un trajet ou une offre. La lecture démarre uniquement à votre demande.</p>
  </div>
  <div class="lecture-commandes">
    <button type="button" class="btn-secondary" data-lecture-pause disabled>Mettre en pause</button>
    <button type="button" class="btn-secondary" data-lecture-stop disabled>Arrêter</button>
    <label for="lecture-vitesse">Vitesse de lecture</label>
    <select id="lecture-vitesse" class="portal-select" aria-describedby="lecture-vitesse-aide">
      <option value="0.75">Lente (0,75×)</option>
      <option value="1" selected>Normale (1×)</option>
      <option value="1.25">Rapide (1,25×)</option>
    </select>
  </div>
  <p id="lecture-vitesse-aide">Changer la vitesse relance le résumé depuis le début.</p>
  <p data-lecture-status role="status" aria-live="polite">Vérification de la disponibilité de la lecture vocale…</p>
</section>
