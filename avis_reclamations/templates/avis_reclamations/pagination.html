{% if page.paginator.num_pages > 1 %}
  <div class="ar-pagination">
    <p>Page {{ page.number }} sur {{ page.paginator.num_pages }} · {{ page.paginator.count }} résultat{{ page.paginator.count|pluralize }}</p>
    <nav aria-label="Pagination">
      {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{% for k, v in request.GET.items %}{% if k != 'page' %}&amp;{{ k }}={{ v|urlencode }}{% endif %}{% endfor %}">← Précédent</a>{% endif %}
      <span class="current">{{ page.number }}</span>
      {% if page.has_next %}<a href="?page={{ page.next_page_number }}{% for k, v in request.GET.items %}{% if k != 'page' %}&amp;{{ k }}={{ v|urlencode }}{% endif %}{% endfor %}">Suivant →</a>{% endif %}
    </nav>
  </div>
{% endif %}
