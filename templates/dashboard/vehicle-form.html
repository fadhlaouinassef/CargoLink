{% load static %}
<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestion véhicule | CargoLink</title><link rel="stylesheet" href="{% static 'css/admin-dashboard.css' %}"></head><body><main class="main-content standalone-admin-form"><a class="back-link" href="{% url 'authentification:admin_vehicles' %}">← Retour à la supervision</a><section class="users-panel"><div class="panel-heading"><div><p class="eyebrow">SUPERVISION ADMINISTRATEUR</p><h1>{% if object %}Modifier{% else %}Ajouter{% endif %} un élément</h1></div></div><form method="post" enctype="multipart/form-data" class="admin-form">{% csrf_token %}{% if form.non_field_errors %}<div class="form-error-summary" role="alert">{{ form.non_field_errors }}</div>{% endif %}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<span class="field-error" role="alert">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="primary-button" type="submit">Enregistrer</button></form></section></main></body></html>
